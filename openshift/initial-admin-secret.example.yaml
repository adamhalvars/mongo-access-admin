# OPTIONAL. Creates the first admin at start-up instead of using the setup code from the log.
# Do not commit a real password. Create the secret from the command line instead:
#   oc create secret generic mongo-access-admin-initial-admin \
#     --from-literal=username=adam --from-literal=password='<at least 12 characters>'
# The password must be changed at the first sign-in. Delete the secret afterwards:
#   oc delete secret mongo-access-admin-initial-admin
apiVersion: v1
kind: Secret
metadata:
  name: mongo-access-admin-initial-admin
type: Opaque
stringData:
  username: admin
  password: CHANGE-ME-at-least-12-chars
